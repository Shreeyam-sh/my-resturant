<!DOCTYPE html>
<html>
<head>

    <title>My Restaurant</title>

    <style>

        body {
            margin: 0;
            font-family: Arial;
        }

        nav {
            background-color: #333;
            padding: 20px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
            font-size: 18px;
        }

        nav a:hover {
            color: orange;
        }

        .banner {
            background-color: orange;
            height: 400px;
            text-align: center;
            padding-top: 100px;
        }

        .banner h1 {
            font-size: 50px;
            color: white;
        }

        .banner p {
            font-size: 22px;
            color: white;
        }

        .banner button {
            background-color: white;
            color: orange;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
        }

    </style>

</head>

<body>

    <nav>
        <a href="#">Home</a>
        <a href="#">Menu</a>
        <a href="#">About Us</a>
        <a href="#">Contact</a>
    </nav>

    <div class="banner">

        <h1>Welcome to Our Restaurant</h1>

        <p>Delicious food made with love!</p>

        <button>View Menu</button>

    </div>

</body>
</html>
